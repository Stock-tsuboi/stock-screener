name: October Stock Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance

      - name: Run October verification
        run: python verify_october.py

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: october-verification
          path: october_verification.csv
          if-no-files-found: warn
          retention-days: 30
